name: 发布安装包

on:
  push:
    tags:
      - 'v*'  # 推送 v1.0.0, v1.1.0 等标签时触发

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        working-directory: .
        run: |
          npm ci

      - name: 设置 Electron 镜像（中国加速）
        shell: pwsh
        run: |
          echo "ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/" >> $env:GITHUB_ENV

      - name: 构建并发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build:renderer
          npx electron-builder --win --x64 --publish always
